<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<style>
  body { font: 13px/1.45 -apple-system, system-ui, sans-serif; background: #14181f; color: #e7ecf3; width: 260px; margin: 0; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #232a35; }
  .row:last-child { border: none; }
  .d { color: #9fb0c3; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t { font-variant-numeric: tabular-nums; font-weight: 600; }
  .off { color: #f0b429; font-size: 12px; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; color: #9fb0c3; }
  #status { font-size: 11.5px; color: #6b7a8d; margin-top: 10px; }
  a { color: #2f9bf0; }
</style>
</head>
<body>
  <h1>⏱ Activitate azi <label><input type="checkbox" id="toggle" checked> activ</label></h1>
  <div id="list">Se încarcă…</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
