name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Boot the server on a throwaway database and check it answers
        run: |
          DATA_DIR="$RUNNER_TEMP/tt" SEED_DEMO=1 PORT=5599 node server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5599/api/state >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5599/api/state | head -c 200
          curl -sf http://localhost:5599/ >/dev/null
